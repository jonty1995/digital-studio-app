services:
  db:
    image: mariadb:10.11
    container_name: digital-studio-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digital_studio_db
      MARIADB_ROOT_PASSWORD: Passw0rd
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-studio-backend
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=Passw0rd
      - JAVA_OPTS=-Xmx512m -Xms256m
      - TZ=Asia/Kolkata
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./lab:/app/lab
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-studio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
