services:
  db:
    image: mysql:8.0
    container_name: digital-studio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_studio_db
      MYSQL_ROOT_PASSWORD: Passw0rd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-studio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=Passw0rd
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./lab:/app/lab
      # Mount the entire host filesystem for absolute path flexibility via the Configuration UI
      - /:/host_machine
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-studio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5174:80" # Mapping original dev port to 80 for backward compatibility if needed
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
