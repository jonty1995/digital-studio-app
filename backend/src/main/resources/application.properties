spring.application.name=digital-studio-app

# File Storage Paths
app.storage.path=${APP_STORAGE_PATH:F:/Project/uploads}
app.lab.path=${APP_LAB_PATH:F:/Project/lab}

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digital_studio_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Passw0rd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# Server Configuration
server.port=8081

# Logging Configuration
logging.file.name=logs/application.log
logging.level.root=INFO
logging.level.com.digitalstudio.app=INFO

# Actuator Configuration (Runtime Control)
management.endpoints.web.exposure.include=health,info,metrics,diskspace,env,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.mail.enabled=false
