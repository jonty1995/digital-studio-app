# Simplified Docker Compose for Raspberry Pi 5 (Built locally)
services:
  db:
    image: mariadb:10.11
    container_name: digital-studio-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digital_studio_db
      MARIADB_ROOT_PASSWORD: Passw0rd
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--password=Passw0rd"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend.run
    container_name: digital-studio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=Passw0rd
      - JAVA_OPTS=-Xmx512m -Xms256m
      - APP_STORAGE_PATH=/app/uploads
      - APP_LAB_PATH=/app/lab
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${DDL_AUTO:-update}
      - TZ=Asia/Kolkata
    ports:
      - "8081:8081"
    volumes:
      - ../uploads:/app/uploads
      - ./logs:/app/logs
      - ../lab:/app/lab
      - /proc:/proc:ro
      - /sys:/sys:ro
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.run
    container_name: digital-studio-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
